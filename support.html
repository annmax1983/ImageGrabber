<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support Image Grabber</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #f0f2f5;
      color: #333;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      max-width: 820px;
      width: 100%;
      overflow: hidden;
    }
    .banner {
      background: linear-gradient(135deg, #4CAF50 0%, #81C784 100%);
      padding: 36px 40px 32px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .banner-icon {
      width: 64px;
      height: 64px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      flex-shrink: 0;
      backdrop-filter: blur(4px);
    }
    .banner-text h1 { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
    .banner-text p { font-size: 14px; opacity: 0.85; line-height: 1.5; }
    .body { display: flex; gap: 0; }
    .col { flex: 1; padding: 32px 36px; }
    .col-left { border-right: 1px solid #eee; }
    .col h2 {
      font-size: 15px; font-weight: 600; color: #4CAF50;
      margin-bottom: 14px; display: flex; align-items: center; gap: 6px;
    }
    .feature-list {
      list-style: none; display: flex; flex-direction: column; gap: 10px;
    }
    .feature-list li {
      font-size: 14px; line-height: 1.6; color: #444;
      padding-left: 22px; position: relative;
    }
    .feature-list li::before {
      content: ''; position: absolute; left: 0; top: 8px;
      width: 8px; height: 8px; border-radius: 50%;
      background: #4CAF50; opacity: 0.5;
    }
    .thank-text { font-size: 14px; line-height: 1.8; color: #555; }
    .thank-text p + p { margin-top: 12px; }
    .thank-text .heart { color: #e74c3c; }
    .cta {
      text-align: center; padding: 28px 36px 36px;
      border-top: 1px solid #eee;
    }
    .cta p { font-size: 13px; color: #888; margin-bottom: 16px; }
    .support-btn {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 14px 36px; background: #66BB6A; color: #fff;
      font-size: 16px; font-weight: 600; text-decoration: none;
      border-radius: 10px; transition: all 0.2s ease;
      box-shadow: 0 2px 8px rgba(76, 175, 80, 0.35);
    }
    .support-btn:hover {
      background: #4CAF50; transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(76, 175, 80, 0.4);
    }
    .support-btn:active { transform: translateY(0); }
    .footer {
      text-align: center; padding: 16px 36px 20px;
      font-size: 12px; color: #aaa;
    }
    .footer a { color: #4CAF50; text-decoration: none; }
    .footer a:hover { text-decoration: underline; }
    @media (max-width: 640px) {
      body { padding: 12px; }
      .banner { padding: 24px 20px; flex-direction: column; text-align: center; }
      .body { flex-direction: column; }
      .col-left { border-right: none; border-bottom: 1px solid #eee; }
      .col { padding: 24px 20px; }
      .cta { padding: 24px 20px 28px; }
    }
  </style>
</head>
<body>

      <div class="banner-icon">📸</div>
      <div class="banner-text">
        <h1>Image Grabber</h1>

      </div>
    </div>

    <div class="body">
      <div class="col col-left">
        <h2 data-i18n="featuresTitle"></h2>
        <ul class="feature-list" id="featureList"></ul>
      </div>
      <div class="col">
        <h2 data-i18n="thankTitle"></h2>
        <div class="thank-text" id="thankText"></div>
      </div>
    </div>

    <div class="cta">
      <p data-i18n="ctaHint"></p>
      <a class="support-btn" href="https://annmax1983.github.io/PicGrabber/support.html" target="_blank" rel="noopener">
        <img src="./assets/coffee.png" alt="" width="28" height="24" style="vertical-align:middle;margin-right:6px"> <span data-i18n="btnText"></span>
      </a>
    </div>

    <div class="footer">

      &nbsp;·&nbsp; Copyright © 2026 Image Grabber

      fr: {

          'Filtrer par dimensions et format : PNG/JPG/WebP/GIF/SVG',

        ],
        thankTitle: '💌 Un petit mot pour vous',
        thank: [
          'Merci d\'utiliser Image Grabber. J\'ai construit cet outil parce que j\'avais souvent besoin de télécharger en lot des images d\'inspiration depuis des pages web.',
          'S\'il vous aide aussi, c\'est déjà la plus belle récompense.',
          'Bien sûr, si vous souhaitez m\'offrir un <span class="heart">☕</span> café, cela me ferait très plaisir — et me motiverait à améliorer Image Grabber encore davantage.'

        ctaHint: 'Cliquez sur le bouton ci-dessous pour accéder à la page de soutien',
        btnText: 'Support My Work',
        privacyPolicy: 'Politique de Confidentialité'
      }
    };

    function detectLang() {
      const code = (navigator.language || 'en').split('-')[0].toLowerCase();
      return I18N[code] ? code : 'en';
    }

    function applyLang(lang) {
      const t = I18N[lang];
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (t[key]) {
          if (key === 'thank') return;
          el.textContent = t[key];
        }
      });
      const list = document.getElementById('featureList');
      list.innerHTML = t.features.map(f => `<li>${f}</li>`).join('');
      const thankDiv = document.getElementById('thankText');
      thankDiv.innerHTML = t.thank.map(p => `<p>${p}</p>`).join('');
      document.documentElement.lang = lang;
    }

    applyLang(detectLang());
  </script>
</body>
</html>
